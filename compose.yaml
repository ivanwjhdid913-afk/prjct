name: water-observation
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: water
      POSTGRES_USER: water
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    volumes:
      - water-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/water-bodies?limit=1', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173', {signal: AbortSignal.timeout(3000)}).then(async r => { if (!r.ok || !(await r.text()).includes('/src/main.tsx')) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
volumes:
  water-data:
